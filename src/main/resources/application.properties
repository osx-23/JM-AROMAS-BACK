spring.application.name=jm-aromas-api
server.port=${PORT:8080}
spring.datasource.url=${DB_JDBC_URL:jdbc:postgresql://localhost:5432/jmaromas}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.sql.init.mode=never
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
# Seguridad: no aceptar pedidos públicos hasta configurar anti-abuso y medios reales.
app.checkout.enabled=${CHECKOUT_ENABLED:false}
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:4200}
app.supabase.url=${SUPABASE_URL:https://gonhxfvelgxnjqpdyzpg.supabase.co}
app.supabase.publishable-key=${SUPABASE_PUBLISHABLE_KEY:}
# Credencial privilegiada SOLO del servidor: nunca exponer al frontend.
app.supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}
# Correo opcional: sin configurar se mantiene aviso en DB y en panel admin.
app.email.resend-key=${RESEND_API_KEY:}
app.email.admin-address=${ADMIN_NOTIFICATION_EMAIL:}
app.email.from-address=${EMAIL_FROM_ADDRESS:}
app.email.front-url=${APP_PUBLIC_URL:http://localhost:4200}

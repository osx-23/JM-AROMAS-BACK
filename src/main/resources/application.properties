spring.application.name=jm-aromas-api
server.port=${PORT:8080}
spring.datasource.url=${DB_JDBC_URL:jdbc:postgresql://localhost:5432/jmaromas}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.sql.init.mode=never
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:4200}

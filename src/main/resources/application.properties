spring.application.name=jm-aromas-api
server.port=${PORT:8080}
spring.datasource.url=${DB_JDBC_URL:jdbc:postgresql://localhost:5432/jmaromas}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.sql.init.mode=never
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
# Interruptor legado, conservado por compatibilidad.
app.checkout.enabled=${CHECKOUT_ENABLED:false}
# Opciones independientes: permiten pedidos manuales solo con cuentas activas.
# En ninguno de estos flujos se confirma el pago automáticamente.
app.checkout.whatsapp-enabled=${CHECKOUT_WHATSAPP_ENABLED:true}
app.checkout.manual-enabled=${CHECKOUT_MANUAL_ENABLED:true}
# Solo administradores autenticados pueden marcar un pedido como prueba y omitir el límite.
# Desactivado por defecto; las pruebas siguen creando pedidos y reservas reales.
app.checkout.admin-test-mode=${CHECKOUT_ADMIN_TEST_MODE:false}
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:4200}
app.supabase.url=${SUPABASE_URL:https://gonhxfvelgxnjqpdyzpg.supabase.co}
app.supabase.publishable-key=${SUPABASE_PUBLISHABLE_KEY:}
# Credencial privilegiada SOLO del servidor: nunca exponer al frontend.
app.supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}
# Gmail SMTP: la clave es una contraseña de aplicación, nunca la contraseña normal.
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
# Sin credenciales, los avisos siguen en la bandeja y no se envían.
app.email.admin-address=${ADMIN_NOTIFICATION_EMAIL:}
app.email.from-address=${EMAIL_FROM_ADDRESS:}
app.email.front-url=${APP_PUBLIC_URL:http://localhost:4200}
